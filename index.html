<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="City Hunt">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%8D%3C/text%3E%3C/svg%3E">
<title>City Hunt</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="map"></div>

<!-- ---------- Setup ---------- -->
<section id="setup" class="panel">
  <div class="panel-inner">
    <h1>City Hunt</h1>
    <p class="sub">Find the cities on the globe.</p>

    <label for="mode">Game</label>
    <select id="mode">
      <option value="click" selected>Click the city I name</option>
      <option value="name">Name the cities I mark</option>
    </select>

    <label for="region">World region</label>
    <select id="region"></select>

    <label for="country">Country <span class="opt">optional</span></label>
    <select id="country"></select>

    <label for="count">Cities</label>
    <select id="count">
      <option value="5" selected>5</option>
      <option value="10">10</option>
      <option value="15">15</option>
      <option value="20">20</option>
      <option value="25">25</option>
    </select>

    <label for="pool">Drawn from</label>
    <select id="pool">
      <option value="0" selected>The largest, exactly</option>
      <option value="20">A random pick of the top 20</option>
      <option value="40">A random pick of the top 40</option>
      <option value="60">A random pick of the top 60</option>
    </select>

    <div id="timing-row" hidden>
      <label for="seconds">Seconds per city</label>
      <select id="seconds">
        <option value="10">10</option>
        <option value="15" selected>15</option>
        <option value="20">20</option>
        <option value="30">30</option>
        <option value="0">No limit</option>
      </select>
    </div>

    <label class="check"><input type="checkbox" id="capitals"> Capital cities only</label>

    <p id="setup-note" class="note"></p>

    <button id="start" class="primary">Start</button>
    <p class="credit">Populations from <a href="https://www.geonames.org/" target="_blank" rel="noopener">GeoNames</a> (CC&nbsp;BY&nbsp;4.0) &middot; imagery &copy; Esri</p>
  </div>
</section>

<!-- ---------- In play ---------- -->
<header id="hud" hidden>
  <div class="hud-row">
    <button id="quit" class="icon" title="Back to setup">&times;</button>
    <div class="prompt">
      <div id="city-name">&nbsp;</div>
      <div id="city-sub" class="muted">&nbsp;</div>
    </div>
    <div class="tally">
      <div id="score">0</div>
      <div id="progress" class="muted">1/5</div>
    </div>
  </div>
</header>

<div id="hint" class="toast" hidden>Tap the map to drop your pin</div>

<footer id="controls" hidden>
  <!-- click mode -->
  <button id="guess" class="primary" disabled>Guess</button>
  <button id="next" class="primary" hidden>Next</button>
  <!-- name mode -->
  <div id="answer-row" hidden>
    <input id="answer" type="text" placeholder="Type a city name"
           autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false">
    <button id="giveup" class="secondary inline">Finish</button>
  </div>
</footer>

<!-- ---------- Round result (click mode) ---------- -->
<section id="result" class="card" hidden>
  <div id="result-city"></div>
  <div id="result-dist" class="big"></div>
  <div id="result-pts" class="pts"></div>
  <div id="result-pop" class="muted"></div>
</section>

<!-- ---------- Summary ---------- -->
<section id="summary" class="panel" hidden>
  <div class="panel-inner">
    <h2>Round complete</h2>
    <div id="final-score" class="final"></div>
    <div id="best" class="muted"></div>
    <ol id="breakdown"></ol>
    <button id="again" class="primary">Play again</button>
    <button id="change" class="secondary">Change settings</button>
  </div>
</section>

<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="app.js"></script>
</body>
</html>
